<!DOCTYPE html>
<html lang="sq">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chatbot — Demo</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0a0e14;color:#e6e6e6;font-family:'Segoe UI',system-ui,sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:20px}
h1{color:#fff;font-size:1.6rem;margin:10px 0 4px}
.sub{color:#9fb3c8;font-size:.85rem;margin-bottom:16px}
.chat{background:#0d1420;border:1px solid #00d4ff33;border-radius:14px;width:100%;max-width:640px;height:55vh;display:flex;flex-direction:column;overflow:hidden}
#log{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:80%;padding:10px 14px;border-radius:12px;font-size:.92rem;line-height:1.5}
.msg.user{align-self:flex-end;background:#00d4ff;color:#04121a;border-bottom-right-radius:4px}
.msg.bot{align-self:flex-start;background:#1b263b;color:#e6e6e6;border-bottom-left-radius:4px;border:1px solid #ffffff14}
.inputbar{display:flex;gap:8px;padding:12px;border-top:1px solid #ffffff14;background:#0a0e14}
.inputbar input{flex:1;background:#0d1420;color:#fff;border:1px solid #ffffff22;border-radius:8px;padding:11px 14px;font-size:.92rem;outline:none}
.inputbar input:focus{border-color:#00d4ff}
.inputbar button{background:#00d4ff;color:#04121a;border:none;padding:11px 22px;border-radius:8px;font-weight:700;cursor:pointer}
.inputbar button:hover{background:#33e0ff}
.hints{margin-top:12px;color:#5c6b7f;font-size:.82rem;max-width:640px;text-align:center;line-height:1.7}
.hints span{background:#1b263b;border:1px solid #ffffff14;border-radius:12px;padding:2px 10px;margin:2px;display:inline-block;cursor:pointer;color:#9fb3c8}
.hints span:hover{color:#00d4ff;border-color:#00d4ff66}
footer{margin-top:16px;color:#5c6b7f;font-size:.8rem}
footer strong{color:#9fb3c8}
</style>
</head>
<body>
<h1>🤖 Chatbot</h1>
<div class="sub">Version web i chatbot-it Tkinter — shkruaj një mesazh dhe boti përgjigjet</div>
<div class="chat">
  <div id="log"></div>
  <div class="inputbar">
    <input id="in" type="text" placeholder="Shkruaj mesazhin..." autocomplete="off">
    <button onclick="send()">Dërgo</button>
  </div>
</div>
<div class="hints">Provo: <span onclick="fill('hello')">hello</span><span onclick="fill('hi')">hi</span><span onclick="fill('how are you')">how are you</span><span onclick="fill('fine')">fine</span><span onclick="fill('i am good')">i am good</span></div>
<footer>Krijuar nga <strong>Erion Nezha</strong> — © 2026</footer>
<script>
// E njëjta logjikë si funksioni send() në Chatbot.py origjinal
function botReply(user){
  user=user.toLowerCase().trim();
  if(user==="hello")return "Bot -> Hi";
  if(user==="hi"||user==="hii"||user==="hiiii")return "Bot -> Hello";
  if(user==="how are you")return "Bot -> fine! and you";
  if(user==="fine"||user==="i am good"||user==="i am doing good")return "Bot -> Great! how can I help you.";
  return "Bot -> Sorry! I dind't got you";
}
function addMsg(text,who){
  const log=document.getElementById('log');
  const d=document.createElement('div');d.className='msg '+who;d.textContent=text;
  log.appendChild(d);log.scrollTop=log.scrollHeight;
}
function send(){
  const inp=document.getElementById('in'),v=inp.value.trim();
  if(!v)return;
  addMsg("You -> "+v,"user");
  setTimeout(()=>addMsg(botReply(v).replace("Bot -> ",""),"bot"),400);
  inp.value="";
}
function fill(t){document.getElementById('in').value=t;send();}
document.getElementById('in').addEventListener('keydown',e=>{if(e.key==='Enter')send();});
addMsg("Përshëndetje! Unë jam chatbot-i. Më shkruaj diçka 👋","bot");
</script>
</body>
</html>
